services:
  # Backend API Web Service
  - type: web
    name: personal-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: dev
      - key: DATABASE_URL
        fromDatabase:
          name: personal-ai-postgres
          property: connectionString
      - key: DATABASE_USERNAME
        fromDatabase:
          name: personal-ai-postgres
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: personal-ai-postgres
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: AI_SYSTEM_MODE
        value: CLOUD
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORAGE_ROOT_PATH
        value: /tmp/documents

  # Frontend Client Static Site (SPA)
  - type: web
    name: personal-ai-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: personal-ai-backend
          property: url

databases:
  - name: personal-ai-postgres
    plan: starter
    region: oregon
    databaseName: personal_ai_db
    user: postgres
    postgresMajorVersion: 16
